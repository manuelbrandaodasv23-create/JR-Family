name: Validar JR Family iOS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/ios.yml'

permissions:
  contents: read

jobs:
  ios-simulator:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - name: Gerar projeto nativo iOS
        run: flutter create --platforms=ios --org com.jrfamily --project-name jr_family .
      - name: Configurar JR Family iOS
        run: python3 tools/prepare_ios.py
      - name: Validar permissoes no plist
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          data = plistlib.loads(Path('ios/Runner/Info.plist').read_bytes())
          assert 'location' in data.get('UIBackgroundModes', [])
          assert 'NSLocationWhenInUseUsageDescription' in data
          assert 'NSLocationAlwaysAndWhenInUseUsageDescription' in data
          print('Permissoes iOS verificadas')
          PY
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Compilar para simulador iOS sem assinatura
        run: flutter build ios --simulator --debug --no-codesign --dart-define=JR_API_BASE_URL=https://jr-family-api-production.up.railway.app
      - name: Arquivos de diagnostico
        if: always()
        run: |
          mkdir -p ../artifacts/ios
          if [ -d ios ]; then
            cp ios/Runner/Info.plist ../artifacts/ios/Info.plist
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JR-Family-iOS-config
          path: artifacts/ios/
          if-no-files-found: ignore
